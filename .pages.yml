media:
  - name: images
    label: عکس‌های تاتاروس
    input: images
    output: /tataros/images
    extensions:
      - jpg
      - jpeg
      - png
      - webp
    rename: false

content:
  - name: catalog
    label: محصولات تاتاروس
    type: file
    path: data/products.json
    format: json
    fields:
      - name: products
        label: فهرست محصولات
        type: object
        list: true
        fields:
          - name: name
            label: نام محصول
            type: string
            required: true

          - name: category
            label: دسته محصول
            type: select
            required: true
            options:
              values:
                - name: rings
                  label: انگشترها
                - name: gemstones
                  label: سنگ‌های طبیعی
                - name: tasbih
                  label: تسبیح‌ها

          - name: price
            label: قیمت به تومان
            type: number

          - name: image
            label: تصویر محصول
            type: image
            options:
              media: images
              path: images
              extensions:
                - jpg
                - jpeg
                - png
                - webp
              rename: false

          - name: description
            label: توضیحات
            type: text

settings:
  content:
    merge: true
