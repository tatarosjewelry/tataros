media:
  - name: images
    label: عکس‌های تاتاروس
    input: .
    output: /tataros
    extensions:
      - jpg
      - jpeg
      - png
      - webp
    rename: false

content:
  - name: catalog
    label: محصولات تاتاروس
    type: file
    path: data/products.json
    format: json
    fields:
      - name: products
        label: فهرست محصولات
        type: object
        list: true
        fields:
          - name: name
            label: نام محصول
            type: string
            required: true

          - name: price
            label: قیمت به تومان
            type: number

          - name: image
            label: تصویر محصول
            type: image
            options:
              media: images
              extensions:
                - jpg
                - jpeg
                - png
                - webp
              rename: false

          - name: description
            label: توضیحات
            type: text
